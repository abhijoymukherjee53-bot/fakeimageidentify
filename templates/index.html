<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIFAKE Image Classifier</title>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 600px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        text-align: center;
    }

    h1 {
        color: #333;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 30px;
    }

    .upload-box {
        border: 2px dashed #667eea;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 20px;
    }

    input[type="file"] {
        margin: 15px 0;
    }

    button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #5568d9;
    }

    #preview {
        max-width: 250px;
        max-height: 250px;
        margin: 20px auto;
        border-radius: 10px;
        display: none;
    }

    #result {
        margin-top: 25px;
        padding: 20px;
        border-radius: 10px;
        display: none;
        background: #f3f3f3;
    }

    .label {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .confidence {
        font-size: 18px;
        color: #555;
    }

    .error {
        color: #d32f2f;
        font-weight: bold;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>🔍 CIFAKE Image Classifier</h1>

<p class="subtitle">
    Upload an image to check whether it looks REAL or AI-GENERATED.
</p>

<div class="upload-box">

    <form id="uploadForm">

        <input
            type="file"
            id="image"
            name="image"
            accept=".png,.jpg,.jpeg,.webp,.bmp"
            required
        >

        <br>

        <img id="preview" alt="Image Preview">

        <br>

        <button type="submit">Analyze Image</button>

    </form>

</div>

<div id="result">
    <div class="label" id="label"></div>
    <div class="confidence" id="confidence"></div>
</div>
```

</div>

<script>
    const form = document.getElementById("uploadForm");
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");

    imageInput.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        }
    });

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const file = imageInput.files[0];

        if (!file) {
            alert("Please select an image.");
            return;
        }

        const formData = new FormData();
        formData.append("image", file);

        result.style.display = "block";
        document.getElementById("label").textContent = "Analyzing...";
        document.getElementById("confidence").textContent = "";

        try {

            const response = await fetch("/predict", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("label").innerHTML =
                    '<span class="error">' + data.error + '</span>';

                document.getElementById("confidence").textContent = "";
                return;
            }

            document.getElementById("label").textContent =
                data.label;

            document.getElementById("confidence").textContent =
                "Confidence: " + data.confidence + "%";

        } catch (error) {

            document.getElementById("label").innerHTML =
                '<span class="error">Unable to connect to server.</span>';

            document.getElementById("confidence").textContent =
                error.message;
        }
    });
</script>

</body>
</html>
